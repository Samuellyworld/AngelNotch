name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: validate and build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            web/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix chrome-extension
          npm ci --prefix web

      - name: Validate project
        run: ./scripts/validate.sh

      - name: Build local app
        run: ./scripts/package-app.sh

      - name: Build website
        run: npm --prefix web run build

      - name: Package CI artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/.build/AngelNotch.app \
            AngelNotch-ci.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AngelNotch-${{ github.sha }}
          path: AngelNotch-ci.zip
          if-no-files-found: error
          retention-days: 14
