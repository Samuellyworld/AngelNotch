name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            web/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix chrome-extension
          npm ci --prefix web

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              resources/info.plist
          )"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project
        run: |
          ./scripts/validate.sh
          npm --prefix web run build

      - name: Configure signing and notarization
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_NOTARY_PROFILE
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release environment secret: $name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/angelnotch-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" \
            | base64 --decode > "$certificate_path"

          security create-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          security set-keychain-settings \
            -lut 21600 \
            "$keychain_path"
          security unlock-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          security import \
            "$certificate_path" \
            -k "$keychain_path" \
            -f pkcs12 \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$certificate_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          xcrun notarytool store-credentials \
            "$APPLE_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"

      - name: Build notarized release
        env:
          ANGELNOTCH_NOTARY_KEYCHAIN: ${{ runner.temp }}/angelnotch-signing.keychain-db
          ANGELNOTCH_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          ANGELNOTCH_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/release-app.sh --notarize

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="dist/AngelNotch-$VERSION-macos.dmg"
          checksum="$artifact.sha256"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              "$artifact" \
              "$checksum" \
              --clobber
            gh release edit \
              "$RELEASE_TAG" \
              --title "AngelNotch $VERSION" \
              --latest \
              --verify-tag
          else
            gh release create \
              "$RELEASE_TAG" \
              "$artifact" \
              "$checksum" \
              --title "AngelNotch $VERSION" \
              --generate-notes \
              --latest \
              --verify-tag
          fi

      - name: Remove temporary signing files
        if: ${{ always() }}
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/angelnotch-signing.keychain-db" \
            2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/angelnotch-signing.keychain-db"
