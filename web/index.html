    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AngelNotch",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "macOS 14.0 or later",
        "url": "https://angelnotch.ng/",
        "downloadUrl": "https://angelnotch.ng/AngelNotch-macos.dmg",
        "description": "AngelNotch is a local-first macOS utility that turns the MacBook notch into a compact, expandable workspace for media, clipboard history, files, focus, calendar events, system controls, and live activities.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Samuel Tosin",
          "url": "https://github.com/Samuellyworld"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does AngelNotch upload my clipboard history?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Clipboard history stays on your Mac. There is no cloud clipboard and nothing is synced anywhere."
            }
          },
          {
            "@type": "Question",
            "name": "Does it record my camera or microphone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. AngelNotch does not record, store, transcribe, or transmit camera or microphone content. During an active call it may sample local microphone amplitude only to draw the compact waveform."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need the Chrome extension?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The extension is optional. It adds YouTube playback information and Chrome download progress, and every other feature works without it."
            }
          },
          {
            "@type": "Question",
            "name": "Which music services are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Spotify, Apple Music, YouTube and YouTube Music."
            }
          },
          {
            "@type": "Question",
            "name": "Which version of macOS is required?",
            "acceptedAnswer": { "@type": "Answer", "text": "macOS 14 or newer." }
          },
          {
            "@type": "Question",
            "name": "Does AngelNotch require an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. There is no sign-up, no login and no account of any kind."
            }
          },
          {
            "@type": "Question",
            "name": "Can I run it from source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The repository has build and development instructions, and the whole project is open on GitHub."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
